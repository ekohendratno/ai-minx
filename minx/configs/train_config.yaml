# minx - Training Configuration
# Small AI Model - Web + Mobile App Coding Assistant
# Target: Laptop RAM 4GB, CPU-only

# === Base Model ===
# Qwen2.5-1.5B-Instruct: lebih pintar untuk tanya jawab, coding, dan Bahasa Indonesia
# RAM Q4_K_M: sekitar 1.1-1.5 GB saat inference CPU
base_model: "Qwen/Qwen2.5-1.5B-Instruct"
model_type: "causal_lm"

# === Dataset ===
dataset_path: "data/processed/minx_train.jsonl"
validation_split: 0.05
max_seq_length: 512

# === LoRA Configuration ===
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  task_type: "CAUSAL_LM"

# === Training Arguments ===
training:
  output_dir: "models/minx-lora"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: false
  bf16: false
  logging_steps: 5
  save_steps: 100
  save_total_limit: 2
  report_to: []

# === RAM Optimization ===
# Untik laptop 4GB: batasi thread & memori
optimization:
  max_threads: 2
  block_size: 128
  gradient_checkpointing: true
  max_memory_cpu: "2GB"

# === Output ===
export:
  output_dir: "models/minx-merged"
  gguf_dir: "models/minx-gguf"
  quant_method: "q4_k_m"
  context_length: 2048
